name: Windows build
description: >
  Builds out/bb-probe.exe, out/bb-gpu-capabilities.exe and out/bb-play.exe with the MSYS2 CLANG64
  toolchain and the code generation the port tunes for x86-64 CPUs with AVX but without AVX2
  (gpu/CMakeLists.txt: BB_ARCH). Shared by the CI and release workflows so both build the same
  binaries.

inputs:
  extra-cmake-args:
    description: Extra -D options for the CMake configure step (for example a different BB_ARCH).
    required: false
    default: ''

outputs:
  version:
    description: The port's version (VERSION in launcher/uncharted_launcher.py).
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: MSYS2 CLANG64 toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: false
        install: >-
          git patch unzip ccache
          mingw-w64-clang-x86_64-toolchain
          mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja
          mingw-w64-clang-x86_64-pkgconf mingw-w64-clang-x86_64-python
          mingw-w64-clang-x86_64-vulkan-headers mingw-w64-clang-x86_64-vulkan-loader
          mingw-w64-clang-x86_64-vulkan-memory-allocator mingw-w64-clang-x86_64-glslang
          mingw-w64-clang-x86_64-sdl3 mingw-w64-clang-x86_64-fmt mingw-w64-clang-x86_64-boost
          mingw-w64-clang-x86_64-robin-map mingw-w64-clang-x86_64-xxhash
          mingw-w64-clang-x86_64-ffmpeg mingw-w64-clang-x86_64-zydis
          mingw-w64-clang-x86_64-spirv-tools mingw-w64-clang-x86_64-spirv-headers
          mingw-w64-clang-x86_64-spirv-cross mingw-w64-clang-x86_64-protobuf
          mingw-w64-clang-x86_64-openssl mingw-w64-clang-x86_64-zlib
          mingw-w64-clang-x86_64-miniupnpc mingw-w64-clang-x86_64-nlohmann-json

    - name: Submodules
      shell: msys2 {0}
      run: |
        git submodule update --init --recursive
        git submodule status

    - name: Compiler cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        key: clang64-ccache-${{ github.sha }}
        restore-keys: |
          clang64-ccache-

    - name: Configure the compiler cache
      shell: msys2 {0}
      run: |
        export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache --max-size=3G
        ccache --version | head -1
        # build.sh checks after configuring that ccache can start the compiler CMake recorded and
        # configures again without the launcher if it cannot, so a cache that does not work with
        # the compiler's path form costs speed here, never a failed build.
        {
          echo "CCACHE_DIR=$CCACHE_DIR"
          echo "BB_CMAKE_ARGS=-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
        } >> "$GITHUB_ENV"

    - name: Build
      shell: msys2 {0}
      env:
        BB_CMAKE_ARGS_EXTRA: ${{ inputs.extra-cmake-args }}
      run: |
        if [[ -n ${BB_CMAKE_ARGS_EXTRA// /} ]]; then
          export BB_CMAKE_ARGS="${BB_CMAKE_ARGS:-} $BB_CMAKE_ARGS_EXTRA"
        fi
        set +e
        bash build.sh 2>&1 | tee build.log
        status=${PIPESTATUS[0]}
        set -e
        if [[ $status -ne 0 ]]; then
          # The full log is only reachable through a signed URL, so put what broke into the
          # annotations of this run (and the tail into the job summary) before failing.
          summary="$GITHUB_STEP_SUMMARY"
          { echo '### build.sh failed'; echo '```'; tail -n 40 build.log; echo '```'; } >> "$summary" || true
          emit() { printf '::error title=build.sh::%s\n' "${1//$'\r'/}" ; }
          grep -m 12 -E 'error:|error C[0-9]|CMake Error|fatal error|undefined reference|FAILED:|No such file|cannot find|does not name a type|expected' build.log \
            | while IFS= read -r line; do emit "${line:0:900}"; done || true
          [[ -f out/gpu-build.log ]] && { tail -n 15 out/gpu-build.log | while IFS= read -r line; do emit "ninja: ${line:0:900}"; done; } || true
          emit "build.sh exited with status $status"
          exit 1
        fi

    - name: Report the build configuration
      shell: msys2 {0}
      run: |
        grep -E '^BB_' out/gpu/CMakeCache.txt || true
        ls -la out/bb-probe.exe out/bb-gpu-capabilities.exe out/bb-play.exe

    - name: Version
      id: version
      shell: msys2 {0}
      run: |
        # The launcher's VERSION is the port's version; release tags are v<VERSION>.
        version=$(sed -n "s/^VERSION = '\(.*\)'/\1/p" launcher/uncharted_launcher.py | head -1)
        [[ -n $version ]] || version="0.0.0-${GITHUB_SHA::8}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Built version $version"
